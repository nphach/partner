services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partner
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: partner
    ports:
      - "5433:5432"
    volumes:
      - partner_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner -d partner"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: partner
      DB_USER: partner
      DB_PASSWORD: partner
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: ./app
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  partner_pg_data:
