spring:
  application:
    name: partner-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:partner}
    username: ${DB_USER:partner}
    password: ${DB_PASSWORD:partner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
